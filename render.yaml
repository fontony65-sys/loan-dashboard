# Render Blueprint: one free Node web service. Data lives in Turso (Render's free disk is wiped on restart).
services:
  - type: web
    name: loan-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: CURRENCY
        value: XAF
      - key: SEED_EXAMPLE_DATA
        value: "false"
